[project]
name = "grpo-guard"
version = "0.4.0"
description = "Trajectory contract, lineage and fault-injection framework for online LLM post-training (TRL GRPO + vLLM server)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GRPO-Guard contributors" }]
keywords = ["rl", "grpo", "trl", "vllm", "lineage", "fault-injection"]
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "torch>=2.4",
]
gpu = [
    "torch>=2.4",
    "transformers>=4.49",
    "trl>=1.10.0",
    "vllm>=0.17.0,<0.27.0",
    "accelerate>=1.0",
    "peft>=0.13",
    "datasets>=3.0",
]

[project.scripts]
grpo-guard = "grpo_guard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/grpo_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
