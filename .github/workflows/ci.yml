name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --extra test
      - name: Run test suite with core coverage gate
        run: |
          uv run pytest tests/ -q \
            --cov=grpo_guard.adapters --cov=grpo_guard.validators \
            --cov=grpo_guard.store --cov=grpo_guard.schema \
            --cov=grpo_guard.faults --cov=grpo_guard.canary \
            --cov=grpo_guard.verify --cov=grpo_guard.resume \
            --cov=grpo_guard.monitor --cov=grpo_guard.prometheus \
            --cov=grpo_guard.doctor --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
      - name: Frozen contract check (F1-F4)
        run: uv run grpo-guard contract-check --cases tests/frozen/f1_f4_v01 --out /tmp/cc_f14
      - name: Frozen contract check (F5-F8, v0.2)
        run: uv run grpo-guard contract-check --cases tests/frozen/f5_f8_v02 --out /tmp/cc_f58
      - name: Frozen contract check (F9-F10, v0.2.1)
        run: uv run grpo-guard contract-check --cases tests/frozen/f9_f10_v01 --out /tmp/cc_f9f10
      - name: Correctness Gate re-verify on real artifacts (F1-F4)
        run: uv run grpo-guard day3-matrix --loop-dir artifacts/v0.1.0/loop --out /tmp/gate_f14
      - name: v0.2 Gate re-verify on real artifacts (F5-F8)
        run: uv run grpo-guard v02-matrix --loop-dir artifacts/v0.1.0/loop --out /tmp/gate_f58
      - name: Evidence chain integrity (SHA256SUMS — all published packs)
        run: |
          for pack in artifacts/v0.1.0 artifacts/v0.2.0-dev artifacts/v0.4.0; do
            echo "== verifying $pack =="
            (cd "$pack" && sha256sum -c SHA256SUMS)
          done
          for pack in artifacts/run_packs/*; do
            echo "== verifying run pack $pack =="
            (cd "$pack" && sha256sum -c SHA256SUMS)
          done
      - name: Evidence chain verification (seals, order, refs)
        run: uv run grpo-guard verify --artifact-dir artifacts/v0.4.0 --events artifacts/v0.4.0/loop/events/events

  docker-demo:
    # CPU demo image: actually builds on every main push (closure of the
    # "Docker not built" gap from the 2026-08-25 audit).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build demo image
        run: docker build -t grpo-guard .
      - name: Image runs (grpo-guard --help)
        run: docker run --rm grpo-guard --help | head -5
      - name: Evidence chain attest inside the image
        run: docker run --rm -v "$PWD/artifacts:/artifacts:ro" grpo-guard verify --artifact-dir /artifacts/v0.4.0 --events /artifacts/v0.4.0/loop/events/events | tail -3
