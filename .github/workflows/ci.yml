name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --extra test
      - name: Run test suite
        run: uv run pytest tests/ -q
      - name: Frozen contract check (F1-F4)
        run: uv run grpo-guard contract-check --cases tests/frozen/f1_f4_v01 --out /tmp/cc_f14
      - name: Frozen contract check (F5-F8, v0.2)
        run: uv run grpo-guard contract-check --cases tests/frozen/f5_f8_v02 --out /tmp/cc_f58
      - name: Evidence chain integrity (SHA256SUMS)
        run: |
          cd artifacts/v0.1.0
          sha256sum -c SHA256SUMS
